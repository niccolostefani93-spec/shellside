# tmux settings for shells Shellwalk keeps in tmux (Settings › General).
#
# Shellwalk runs its own tmux server (`tmux -L shellwalk -f <this file>`), so
# your own tmux sessions and ~/.tmux.conf are left alone, and these settings
# never leak into them.
#
# The aim is for tmux to be invisible: the browser terminal should look and
# scroll exactly as it does without it.

# No status bar: the tab bar in the browser already names the shell.
set -g status off

# Do not switch to the alternate screen. Output then lands in the browser
# terminal's own scrollback, so touch scrolling on a phone keeps working
# without entering tmux copy mode.
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'

set -g default-terminal "screen-256color"
set -ga terminal-overrides ',xterm-256color:Tc'
set -g history-limit 50000

# Escape reaches vim at once instead of after tmux's default delay.
set -s escape-time 0

# Follow the size of whichever browser tab attached last.
setw -g aggressive-resize on

# No prefix key: every key goes to the shell, Ctrl-B included. Shellwalk
# attaches and detaches on its own, so tmux needs no keys of its own.
set -g prefix None
unbind C-b
